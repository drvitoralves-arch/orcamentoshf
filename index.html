<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orçamentos HF</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Oswald&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbfaf8; font: 15px "Open Sans", sans-serif; color: #333 }
  form { width: 100%; max-width: 320px; padding: 16px; box-sizing: border-box; text-align: center }
  h1 { font: 400 28px Oswald, sans-serif; color: #e0645c; margin: 0 0 20px }
  input { width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; padding: 11px; font: 20px "Open Sans"; text-align: center; letter-spacing: .3em; background: #fff }
  input:focus { outline: 2px solid #e0645c; border-color: transparent }
  button { margin-top: 14px; width: 100%; border: 0; background: #e0645c; color: #fff; border-radius: 8px; padding: 13px; font: 600 15px "Open Sans"; cursor: pointer }
  button:disabled { opacity: .6; cursor: default }
  #erro { min-height: 1.4em; margin-top: 12px; color: #b8433b }
</style>
</head>
<body>
<form id="f">
  <h1>Orçamentos HF</h1>
  <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="PIN" autofocus aria-label="PIN">
  <button id="entrar">Entrar</button>
  <div id="erro" role="alert"></div>
</form>
<script>
{
// o Worker da Cloudflare: bane por IP quem erra o PIN e repassa ao Apps Script
const SERVIDOR = "https://orcamentoshf.drvitoralves.workers.dev";
const $ = id => document.getElementById(id);
$("f").onsubmit = async e => {
  e.preventDefault();
  const pin = $("pin").value, orc = new URLSearchParams(location.search).get("orc") || "cirurgia";
  $("entrar").disabled = true; $("entrar").textContent = "Entrando…"; $("erro").textContent = "";
  try {
    const res = await fetch(SERVIDOR, { method: "POST", body: JSON.stringify({ acao: "abrir", args: [pin, orc] }) });
    const d = await res.json().catch(() => { throw new Error("Resposta inválida do servidor"); });
    if (!d.ok) throw new Error(d.erro || "Erro");
    // o PIN só vive na memória desta aba (window sobrevive ao document.open)
    window.SERVIDOR = SERVIDOR; window.PIN_ABRIR = pin;
    document.open(); document.write(d.r); document.close();
  } catch (err) {
    $("erro").textContent = err instanceof TypeError ? "Sem conexão com o servidor. Tente de novo." : err.message;
    $("pin").value = ""; $("entrar").disabled = false; $("entrar").textContent = "Entrar"; $("pin").focus();
  }
};
}
</script>
</body>
</html>
